name: CI

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  deploy:
    uses: VamsiPothireddy-Dev/github-actions/.github/workflows/build-deploy.yml@main
    with:
      app-name: helloword-api
      image-name: vamsipothireddy/helloword-api
      service-port: 8000
      target-port: 8000
      istio-host: api.vamsipothireddy.com
      istio-path-prefix: /helloword-api
      namespace: default
    secrets: inherit
